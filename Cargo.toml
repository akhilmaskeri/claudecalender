[package]
name = "claudecalender"
version = "0.1.0"
edition = "2024"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
reqwest     = { version = "0.12", features = ["json", "blocking"] }
dirs        = "5"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
ratatui     = "0.29"
crossterm   = "0.28"
